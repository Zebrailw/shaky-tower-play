<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Шаткая башня</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2433; overflow: hidden; touch-action: none; }
      /* Игровая область = окно без вырезов и системных панелей (safe-area); фон #backdrop закрывает всё окно, включая их. */
      #game { position: fixed; inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
      #backdrop { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
      /* Слои окна: фон (0) → затемнение модалок (1) → поле игры (2, прозрачное) → виньетка опасности и кинополосы повтора (3) → заставка (4). */
      #game canvas { position: relative; z-index: 2; }
      #dim { position: fixed; inset: 0; z-index: 1; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.18s; }
      #dim.on { pointer-events: auto; }
      #danger { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0; box-shadow: inset 0 0 14vmin 3vmin #ff2d3d; }
      #cine { position: fixed; inset: 0; z-index: 3; pointer-events: none; visibility: hidden; }
      #cine.on { visibility: visible; }
      #cine i { position: absolute; left: 0; right: 0; background: rgba(0, 0, 0, 0.82); }
      #cine .t { top: 0; height: max(9vh, 64px); }
      #cine .b { bottom: 0; height: max(11vh, 76px); display: flex; align-items: center; justify-content: center; gap: 12px; }
      #cine .rec { width: 14px; height: 14px; border-radius: 50%; background: #ff3b4a; animation: blink 0.9s ease-in-out infinite alternate; }
      #cine b { color: #fff; font: bold clamp(20px, 3.4vh, 30px) sans-serif; letter-spacing: 2px; }
      @keyframes blink { from { opacity: 1; } to { opacity: 0.2; } }
      /* Тени у canvas нет: на широких окнах она рисовала вертикальные границы поля на непрерывном фоне. */
      /* Пока грузится Phaser: пульсирующий жилец вместо пустого экрана (текста нет, перевод не нужен). */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4; pointer-events: none; }
      #boot i { width: 64px; height: 40px; border-radius: 12px; background: #f2a65a; border: 4px solid #2a2233; animation: boot 0.7s ease-in-out infinite alternate; }
      @keyframes boot { from { transform: scale(1.15, 0.85); } to { transform: scale(0.88, 1.18) rotate(-6deg); } }
    </style>
    <script type="module" crossorigin src="./assets/index-tPVqIS36.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-0YPJO2g1.js">
  </head>
  <body>
    <div id="boot" aria-hidden="true"><i></i></div>
    <div id="dim"></div>
    <div id="game"></div>
    <div id="danger"></div>
    <div id="cine"><i class="t"></i><i class="b"><span class="rec"></span><b></b></i></div>
  </body>
</html>
